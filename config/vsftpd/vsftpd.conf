listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=002
dirmessage_enable=YES
xferlog_enable=YES

# Chroot sur le dossier web
chroot_local_user=YES
local_root=/var/www

# Utilisateurs autorises
userlist_enable=YES
userlist_file=/etc/vsftpd.userlist
userlist_deny=NO

# TLS avec le certificat Starfleet
ssl_enable=YES
force_local_logins_ssl=YES
force_local_data_ssl=YES
ssl_tlsv1=YES
ssl_sslv2=NO
ssl_sslv3=NO
require_ssl_reuse=NO
rsa_cert_file=/etc/ssl/starfleet/starfleet.crt
rsa_private_key_file=/etc/ssl/starfleet/starfleet.key

# Mode passif (ports ouverts dans ufw)
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100
pasv_address=192.168.17.1
